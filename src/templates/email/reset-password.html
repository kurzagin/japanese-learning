<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 24px; background-color: #f4f3ed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #111;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width: 480px; margin: 0 auto; background: #ffffff; border: 2px solid #000080; padding: 24px;">
    <tr>
      <td>
        <h2 style="margin: 0 0 12px 0; color: #000080; font-size: 18px; font-weight: bold;">SAKANA // 魚</h2>
        <p style="margin: 0 0 16px 0; font-size: 14px; line-height: 1.5; color: #333;">
          We received a request to reset your password. Click below to choose a new password:
        </p>
        <p style="margin: 0 0 20px 0;">
          <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #000080; color: #ffffff; padding: 10px 18px; text-decoration: none; font-size: 13px; font-weight: bold; border-radius: 2px;">
            Reset Password →
          </a>
        </p>
        <p style="margin: 0; font-size: 11px; color: #777;">
          Or enter code: <strong style="font-family: monospace; color: #111;">{{ .Token }}</strong>. If you didn't request this, ignore this email.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
