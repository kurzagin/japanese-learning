<svg xmlns="http://www.w3.org/2000/svg" width="80" height="33" viewBox="0 0 80 33" shape-rendering="crispEdges">
  <defs>
    <style>
      .krzgn-mono { font-family: monospace, "Courier New", sans-serif; font-size: 7.5px; font-weight: bold; letter-spacing: 0.8px; }
      .krzgn-sub { font-family: monospace, "Courier New", sans-serif; font-size: 5.5px; letter-spacing: 0.6px; }
      .cuneiform { font-size: 11px; font-family: "Segoe UI Historic", "Noto Sans Cuneiform", monospace, sans-serif; }
    </style>
  </defs>

  <!-- Border & Dark Background -->
  <rect x="0" y="0" width="80" height="33" fill="#090a0f" stroke="#2a2e3d" stroke-width="1" />
  
  <!-- Left Header with Sumerian glyph accent -->
  <rect x="2" y="2" width="22" height="29" fill="#121520" />
  <text x="5" y="21" fill="#e2b714" class="cuneiform">𒀭</text>

  <!-- Divider -->
  <line x1="24" y1="2" x2="24" y2="31" stroke="#2a2e3d" />

  <!-- Right Details -->
  <text x="27" y="13" fill="#ffffff" class="krzgn-mono">KURZAGIN</text>
  <rect x="27" y="17" width="48" height="10" fill="#1a1e2e" />
  <text x="29" y="24.5" fill="#e2b714" class="krzgn-sub">SYSTEMS</text>
</svg>
