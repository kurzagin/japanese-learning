<svg xmlns="http://www.w3.org/2000/svg" width="80" height="33" viewBox="0 0 80 33" shape-rendering="crispEdges">
  <defs>
    <style>
      .mono-title { font-family: monospace, "Courier New", sans-serif; font-size: 8px; font-weight: bold; letter-spacing: 0.5px; }
      .mono-sub { font-family: monospace, "Courier New", sans-serif; font-size: 6px; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Border & Background -->
  <rect x="0" y="0" width="80" height="33" fill="#0d131f" stroke="#253549" stroke-width="1" />
  <rect x="1" y="1" width="78" height="1" fill="#38bdf8" opacity="0.4" />
  
  <!-- Left elemental glyph bar -->
  <rect x="2" y="2" width="22" height="29" fill="#141e2e" />
  <!-- Anemo / Genshin style star/diamond icon -->
  <polygon points="13,6 16,16 23,16 17,21 19,28 13,23 7,28 9,21 3,16 10,16" fill="#60a5fa" opacity="0.25" />
  <polygon points="13,8 15,15 20,15 16,19 17,24 13,21 9,24 10,19 6,15 11,15" fill="#38bdf8" />
  <circle cx="13" cy="16" r="2" fill="#ffffff" />

  <!-- Divider -->
  <line x1="24" y1="2" x2="24" y2="31" stroke="#253549" />

  <!-- Right Side Content -->
  <text x="28" y="13" fill="#ffffff" class="mono-title">E-TEYVAT</text>
  <rect x="28" y="17" width="46" height="11" fill="#1e293b" />
  <text x="31" y="25" fill="#38bdf8" class="mono-sub">ARCHIVE</text>
  <circle cx="68" cy="22" r="2" fill="#34d399" />
</svg>
