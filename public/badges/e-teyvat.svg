<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <defs>
    <style>
      .mono-title { font-family: monospace, "Courier New", sans-serif; font-size: 8px; font-weight: bold; letter-spacing: 0.5px; }
      .mono-sub { font-family: monospace, "Courier New", sans-serif; font-size: 6px; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Border & Background -->
  <rect x="0" y="0" width="88" height="31" fill="#0d131f" stroke="#253549" stroke-width="1" />
  <rect x="1" y="1" width="86" height="1" fill="#38bdf8" opacity="0.4" />
  
  <!-- Left elemental glyph bar -->
  <rect x="2" y="2" width="22" height="27" fill="#141e2e" />
  <!-- Anemo / Genshin style star/diamond icon -->
  <polygon points="13,5 16,15 23,15 17,20 19,27 13,22 7,27 9,20 3,15 10,15" fill="#60a5fa" opacity="0.25" />
  <polygon points="13,7 15,14 20,14 16,18 17,23 13,20 9,23 10,18 6,14 11,14" fill="#38bdf8" />
  <circle cx="13" cy="15" r="2" fill="#ffffff" />

  <!-- Divider -->
  <line x1="24" y1="2" x2="24" y2="29" stroke="#253549" />

  <!-- Right Side Content -->
  <text x="28" y="12" fill="#ffffff" class="mono-title">E-TEYVAT</text>
  <rect x="28" y="16" width="52" height="10" fill="#1e293b" />
  <text x="31" y="23.5" fill="#38bdf8" class="mono-sub">ARCHIVE</text>
  <circle cx="74" cy="21" r="2" fill="#34d399" />
</svg>
