<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <defs>
    <style>
      .bold-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif; font-size: 8px; font-weight: 900; letter-spacing: 1.5px; }
      .tag-txt { font-family: monospace, "Courier New", sans-serif; font-size: 5.5px; letter-spacing: 1.2px; font-weight: 600; }
    </style>
  </defs>

  <!-- Border & Monochrome Studio Background -->
  <rect x="0" y="0" width="88" height="31" fill="#050505" stroke="#333333" stroke-width="1" />
  
  <!-- Left Studio Emblem Box -->
  <rect x="2" y="2" width="23" height="27" fill="#111111" />
  <!-- VXNUS Mark -->
  <polygon points="6,8 13.5,22 13.5,22 21,8 17,8 13.5,16 10,8" fill="#ffffff" />
  <rect x="12" y="22" width="3" height="3" fill="#ffffff" />

  <!-- Divider -->
  <line x1="25" y1="2" x2="25" y2="29" stroke="#222222" />

  <!-- Right Side Content -->
  <text x="29" y="13" fill="#ffffff" class="bold-txt">VXNUS</text>
  
  <!-- Pill -->
  <rect x="29" y="16" width="53" height="10" fill="#ffffff" />
  <text x="32" y="23.5" fill="#000000" class="tag-txt">STUDIO</text>
</svg>
