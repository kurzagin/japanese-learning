<svg xmlns="http://www.w3.org/2000/svg" width="80" height="33" viewBox="0 0 80 33" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sakanaBlink {
        0%, 48% { opacity: 1; }
        50%, 98% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes fishWiggle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1px); }
      }
      .blink { animation: sakanaBlink 1.1s steps(1, end) infinite; }
      .wiggle { animation: fishWiggle 0.6s steps(1, end) infinite; transform-origin: 12px 16px; }
      .pixel-text { font-family: monospace, "Courier New", sans-serif; font-size: 8px; font-weight: bold; }
      .pixel-sub { font-family: monospace, "Courier New", sans-serif; font-size: 6.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Outer Bevel -->
  <rect x="0" y="0" width="80" height="33" fill="#c0c0c0" />
  <rect x="0" y="0" width="79" height="1" fill="#ffffff" />
  <rect x="0" y="0" width="1" height="32" fill="#ffffff" />
  <rect x="0" y="32" width="80" height="1" fill="#000000" />
  <rect x="79" y="0" width="1" height="33" fill="#000000" />
  <rect x="1" y="31" width="78" height="1" fill="#808080" />
  <rect x="78" y="1" width="1" height="31" fill="#808080" />

  <!-- Titlebar style left header -->
  <rect x="2" y="2" width="22" height="29" fill="#000080" />
  <rect x="2" y="2" width="22" height="1" fill="#1084d0" />
  
  <!-- Pixel Fish (魚) in left blue column -->
  <g class="wiggle">
    <rect x="8" y="7" width="10" height="2" fill="#ffffff" />
    <rect x="6" y="9" width="14" height="2" fill="#ffffff" />
    <rect x="5" y="11" width="16" height="5" fill="#ffffff" />
    <rect x="7" y="16" width="12" height="2" fill="#ffffff" />
    <rect x="9" y="18" width="8" height="2" fill="#ffffff" />
    <rect x="11" y="20" width="4" height="2" fill="#ffffff" />
    <rect x="9" y="22" width="8" height="1" fill="#ffffff" />
    <rect x="7" y="23" width="12" height="2" fill="#ffffff" />
    <rect x="8" y="12" width="2" height="2" fill="#000080" />
  </g>

  <!-- Right Side Background -->
  <rect x="24" y="2" width="54" height="29" fill="#008080" />

  <!-- Top label: SAKANA -->
  <text x="27" y="13" fill="#ffffff" class="pixel-text" letter-spacing="1">SAKANA</text>
  
  <!-- Sub label: KANA (without 98) -->
  <rect x="27" y="17" width="28" height="10" fill="#000000" />
  <text x="30" y="24.5" fill="#00ff66" class="pixel-sub" letter-spacing="1">KANA</text>

  <!-- Classic Retro Blinking Cursor -->
  <g class="blink">
    <rect x="58" y="17" width="5" height="10" fill="#00ff66" />
  </g>
  <!-- Mini retro pixel badge star -->
  <rect x="69" y="7" width="3" height="3" fill="#ffff00" class="blink" />
</svg>
