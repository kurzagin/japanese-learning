<svg xmlns="http://www.w3.org/2000/svg" width="88" height="31" viewBox="0 0 88 31" shape-rendering="crispEdges">
  <defs>
    <style>
      @keyframes sakanaBlink {
        0%, 48% { opacity: 1; }
        50%, 98% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes fishWiggle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1px); }
      }
      .blink { animation: sakanaBlink 1.1s steps(1, end) infinite; }
      .wiggle { animation: fishWiggle 0.6s steps(1, end) infinite; transform-origin: 12px 15px; }
      .pixel-text { font-family: monospace, "Courier New", sans-serif; font-size: 8px; font-weight: bold; }
      .pixel-sub { font-family: monospace, "Courier New", sans-serif; font-size: 6.5px; font-weight: bold; }
    </style>
  </defs>

  <!-- Outer Bevel -->
  <rect x="0" y="0" width="88" height="31" fill="#c0c0c0" />
  <rect x="0" y="0" width="87" height="1" fill="#ffffff" />
  <rect x="0" y="0" width="1" height="30" fill="#ffffff" />
  <rect x="0" y="30" width="88" height="1" fill="#000000" />
  <rect x="87" y="0" width="1" height="31" fill="#000000" />
  <rect x="1" y="29" width="86" height="1" fill="#808080" />
  <rect x="86" y="1" width="1" height="29" fill="#808080" />

  <!-- Titlebar style left header -->
  <rect x="2" y="2" width="22" height="27" fill="#000080" />
  <rect x="2" y="2" width="22" height="1" fill="#1084d0" />
  
  <!-- Pixel Fish (魚) in left blue column -->
  <g class="wiggle">
    <rect x="8" y="6" width="10" height="2" fill="#ffffff" />
    <rect x="6" y="8" width="14" height="2" fill="#ffffff" />
    <rect x="5" y="10" width="16" height="5" fill="#ffffff" />
    <rect x="7" y="15" width="12" height="2" fill="#ffffff" />
    <rect x="9" y="17" width="8" height="2" fill="#ffffff" />
    <rect x="11" y="19" width="4" height="2" fill="#ffffff" />
    <rect x="9" y="21" width="8" height="1" fill="#ffffff" />
    <rect x="7" y="22" width="12" height="2" fill="#ffffff" />
    <rect x="8" y="11" width="2" height="2" fill="#000080" />
  </g>

  <!-- Right Side Background -->
  <rect x="24" y="2" width="62" height="27" fill="#008080" />

  <!-- Top label: SAKANA -->
  <text x="28" y="12" fill="#ffffff" class="pixel-text" letter-spacing="1">SAKANA</text>
  
  <!-- Sub label: KANA -->
  <rect x="28" y="15" width="30" height="10" fill="#000000" />
  <text x="31" y="22.5" fill="#00ff66" class="pixel-sub" letter-spacing="1">KANA</text>

  <!-- Classic Retro Blinking Cursor -->
  <g class="blink">
    <rect x="61" y="15" width="5" height="10" fill="#00ff66" />
  </g>
  <!-- Mini retro pixel badge star -->
  <rect x="76" y="6" width="3" height="3" fill="#ffff00" class="blink" />
</svg>
